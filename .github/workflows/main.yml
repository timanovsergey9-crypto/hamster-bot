name: Auto Posts

on:
  schedule:
    # Старые посты (данные)
    - cron: '0 5 * * *'      # 08:00 MSK — morning_finance
    - cron: '30 9 * * *'     # 12:30 MSK — midday_finance
    - cron: '0 13 * * *'     # 16:00 MSK — afternoon_finance
    - cron: '0 17 * * *'     # 20:00 MSK — evening_finance
    # Дополнительные авторские публикации
    - cron: '10 7 * * *'     # 10:10 MSK — grok_morning
    - cron: '40 11 * * *'    # 14:40 MSK — grok_midday
    # Мотивация
    - cron: '30 10 * * *'    # 13:30 MSK — grok_motivation

jobs:
  morning_old:
    if: github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Morning Finance (data)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          CHAT_QUOTES: ${{ secrets.CHAT_QUOTES }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MODE: morning_finance
        run: python bot.py

  grok_morning:
    if: github.event.schedule == '10 7 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Grok Morning
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          CHAT_HYPE: ${{ secrets.CHAT_HYPE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MODE: grok_morning
        run: python bot.py

  midday_old:
    if: github.event.schedule == '30 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Midday Finance (data)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MODE: midday_finance
        run: python bot.py

  grok_midday:
    if: github.event.schedule == '40 11 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Grok Midday
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          CHAT_HYPE: ${{ secrets.CHAT_HYPE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MODE: grok_midday
        run: python bot.py

  motivation:
    if: github.event.schedule == '30 10 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Grok Motivation
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_HYPE: ${{ secrets.CHAT_HYPE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MODE: grok_motivation
        run: python bot.py

  afternoon:
    if: github.event.schedule == '0 13 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Afternoon Finance
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MODE: afternoon_finance
        run: python bot.py

  evening_old:
    if: github.event.schedule == '0 17 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Evening Finance (data)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MODE: evening_finance
        run: python bot.py
