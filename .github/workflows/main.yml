name: Auto Posts

on:
  schedule:
    # Время UTC; все публикации выходят по Москве (UTC+3).
    # Cron сдвинут на 45 минут раньше целевого слота, чтобы компенсировать задержку GitHub Actions.
    - cron: '15 4 * * *'   # цель 08:00 МСК — утренний обзор рынка + экономический календарь
    - cron: '15 5 * * *'   # цель 09:00 МСК — ELEVATIONLIVE, утро
    - cron: '15 9 * * *'   # цель 13:00 МСК — Палата Хомяка, образовательная рубрика
    - cron: '15 14 * * *'  # цель 18:00 МСК — ELEVATIONLIVE, вечер
    - cron: '15 15 * * *'  # цель 19:00 МСК — вечерний обзор рынка + главные новости
  workflow_dispatch:
    inputs:
      slot:
        description: "Какой слот опубликовать. Значение none ничего не публикует."
        required: true
        type: choice
        default: none
        options:
          - none
          - morning_market
          - motivation_morning
          - finance_education
          - motivation_evening
          - evening_market

jobs:
  morning_market:
    if: github.event.schedule == '15 4 * * *' || (github.event_name == 'workflow_dispatch' && inputs.slot == 'morning_market')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Утренний обзор и экономический календарь
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_FINANCE_GROUP_ID: ${{ secrets.VK_FINANCE_GROUP_ID }}
          VK_HYPE_GROUP_ID: ${{ secrets.VK_HYPE_GROUP_ID }}
          VK_FINANCE_TG_URL: ${{ secrets.VK_FINANCE_TG_URL }}
          VK_HYPE_TG_URL: ${{ secrets.VK_HYPE_TG_URL }}
          MODE: morning_finance
        run: python bot.py

  motivation_morning:
    if: github.event.schedule == '15 5 * * *' || (github.event_name == 'workflow_dispatch' && inputs.slot == 'motivation_morning')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: ELEVATIONLIVE — утренний пост
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_HYPE: ${{ secrets.CHAT_HYPE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_FINANCE_GROUP_ID: ${{ secrets.VK_FINANCE_GROUP_ID }}
          VK_HYPE_GROUP_ID: ${{ secrets.VK_HYPE_GROUP_ID }}
          VK_FINANCE_TG_URL: ${{ secrets.VK_FINANCE_TG_URL }}
          VK_HYPE_TG_URL: ${{ secrets.VK_HYPE_TG_URL }}
          MODE: grok_motivation_morning
        run: python bot.py

  finance_education:
    if: github.event.schedule == '15 9 * * *' || (github.event_name == 'workflow_dispatch' && inputs.slot == 'finance_education')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Палата Хомяка — образовательная рубрика
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_FINANCE_GROUP_ID: ${{ secrets.VK_FINANCE_GROUP_ID }}
          VK_FINANCE_TG_URL: ${{ secrets.VK_FINANCE_TG_URL }}
          MODE: grok_midday
        run: python bot.py

  motivation_evening:
    if: github.event.schedule == '15 14 * * *' || (github.event_name == 'workflow_dispatch' && inputs.slot == 'motivation_evening')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: ELEVATIONLIVE — вечерняя практика
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_HYPE: ${{ secrets.CHAT_HYPE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_FINANCE_GROUP_ID: ${{ secrets.VK_FINANCE_GROUP_ID }}
          VK_HYPE_GROUP_ID: ${{ secrets.VK_HYPE_GROUP_ID }}
          VK_FINANCE_TG_URL: ${{ secrets.VK_FINANCE_TG_URL }}
          VK_HYPE_TG_URL: ${{ secrets.VK_HYPE_TG_URL }}
          MODE: grok_motivation_evening
        run: python bot.py

  evening_market:
    if: github.event.schedule == '15 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.slot == 'evening_market')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Вечерний обзор и главные новости
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_FINANCE_GROUP_ID: ${{ secrets.VK_FINANCE_GROUP_ID }}
          VK_FINANCE_TG_URL: ${{ secrets.VK_FINANCE_TG_URL }}
          MODE: evening_finance
        run: python bot.py
