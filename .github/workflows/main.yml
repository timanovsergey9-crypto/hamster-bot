name: Auto Posts

on:
  push:
    branches: [main]
  schedule:
    # Время UTC; все публикации выходят по Москве (UTC+3).
    - cron: '0 5 * * *'   # 08:00 — утренний обзор рынка + экономический календарь
    - cron: '0 6 * * *'   # 09:00 — ELEVATIONLIVE, утро
    - cron: '0 10 * * *'  # 13:00 — Палата Хомяка, образовательная рубрика
    - cron: '0 15 * * *'  # 18:00 — ELEVATIONLIVE, вечер
    - cron: '0 16 * * *'  # 19:00 — вечерний обзор рынка + главные новости

jobs:
  morning_market:
    if: github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Утренний обзор и экономический календарь
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_FINANCE_GROUP_ID: ${{ secrets.VK_FINANCE_GROUP_ID }}
          VK_HYPE_GROUP_ID: ${{ secrets.VK_HYPE_GROUP_ID }}
          VK_FINANCE_TG_URL: ${{ secrets.VK_FINANCE_TG_URL }}
          VK_HYPE_TG_URL: ${{ secrets.VK_HYPE_TG_URL }}
          MODE: morning_finance
        run: python bot.py

  motivation_morning:
    if: github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: ELEVATIONLIVE — утренний пост
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_HYPE: ${{ secrets.CHAT_HYPE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_FINANCE_GROUP_ID: ${{ secrets.VK_FINANCE_GROUP_ID }}
          VK_HYPE_GROUP_ID: ${{ secrets.VK_HYPE_GROUP_ID }}
          VK_FINANCE_TG_URL: ${{ secrets.VK_FINANCE_TG_URL }}
          VK_HYPE_TG_URL: ${{ secrets.VK_HYPE_TG_URL }}
          MODE: grok_motivation_morning
        run: python bot.py

  finance_education:
    if: github.event.schedule == '0 10 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Палата Хомяка — образовательная рубрика
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_FINANCE_GROUP_ID: ${{ secrets.VK_FINANCE_GROUP_ID }}
          VK_FINANCE_TG_URL: ${{ secrets.VK_FINANCE_TG_URL }}
          MODE: grok_midday
        run: python bot.py

  motivation_evening:
    if: github.event.schedule == '0 15 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: ELEVATIONLIVE — вечерняя практика
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_HYPE: ${{ secrets.CHAT_HYPE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_FINANCE_GROUP_ID: ${{ secrets.VK_FINANCE_GROUP_ID }}
          VK_HYPE_GROUP_ID: ${{ secrets.VK_HYPE_GROUP_ID }}
          VK_FINANCE_TG_URL: ${{ secrets.VK_FINANCE_TG_URL }}
          VK_HYPE_TG_URL: ${{ secrets.VK_HYPE_TG_URL }}
          MODE: grok_motivation_evening
        run: python bot.py

  evening_market:
    if: github.event.schedule == '0 16 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Вечерний обзор и главные новости
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_FINANCE_GROUP_ID: ${{ secrets.VK_FINANCE_GROUP_ID }}
          VK_FINANCE_TG_URL: ${{ secrets.VK_FINANCE_TG_URL }}
          MODE: evening_finance
        run: python bot.py

  smoke_test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile bot.py
      - name: Send Telegram test messages
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_FINANCE: ${{ secrets.CHAT_FINANCE }}
          CHAT_HYPE: ${{ secrets.CHAT_HYPE }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ.get("BOT_TOKEN", "")
          if not token:
              raise SystemExit("BOT_TOKEN is missing")
          chats = [("Палата Хомяка", os.getenv("CHAT_FINANCE", "")),
                   ("ELEVATIONLIVE", os.getenv("CHAT_HYPE", ""))]
          sent = 0
          for label, chat in chats:
              if not chat:
                  print(f"{label}: chat secret missing, skipped")
                  continue
              text = f"🧪 ТЕСТ HAMSTER BOT\\nПроверка доставки в {label}. Это техническое сообщение, не торговый сигнал."
              data = urllib.parse.urlencode({"chat_id": chat, "text": text}).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              with urllib.request.urlopen(req, timeout=25) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise SystemExit(f"{label}: Telegram rejected message: {result}")
              print(f"{label}: Telegram test delivered")
              sent += 1
          if not sent:
              raise SystemExit("No Telegram chat IDs configured")
          PY
